# Go 服务配置
app:
  host: 0.0.0.0
  port: 8080
  jwt_secret: "your-super-secret-key-change-in-production"
  jwt_expire: 3600        # Access Token 过期时间（秒）
  refresh_expire: 604800   # Refresh Token 过期时间（秒）

# Python AI 服务配置
ai:
  host: localhost
  port: 8081
