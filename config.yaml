# Go 服务配置
app:
  host: 0.0.0.0
  port: 18080
  jwt_secret: "your-super-secret-key-change-in-production"
  jwt_expire: 3600        # Access Token 过期时间（秒）
  refresh_expire: 604800   # Refresh Token 过期时间（秒）

# Python AI 服务配置
ai:
  host: localhost
  port: 8081

# 日志配置
logging:
  level: info        # 日志级别: debug/info/warn/error
  format: json       # 日志格式: json/text
  output: both       # 输出方式: file/stdout/both
  max_size: 100      # 单个文件最大 MB
  max_age: 30        # 保留天数
  compress: true     # 是否压缩历史日志
