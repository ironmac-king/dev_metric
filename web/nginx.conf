server {
    listen 3002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理 - Go 后端
    location /api/v1/ {
        proxy_pass http://go-backend:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AI 服务代理
    location /api/v1/llm-ask/ {
        proxy_pass http://python-ai:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 意图模型代理
    location /api/v1/intent/ {
        proxy_pass http://intent-model:18082/;
        proxy_set_header Host $host;
    }
}
