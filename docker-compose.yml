version: '3.8'
services:
  neo4j:
    image: neo4j:5.15-community
    container_name: dev-metric-neo4j
    ports:
      - "7474:7474"  # HTTP (Browser)
      - "7687:7687"  # Bolt (Protocol)
    environment:
      - NEO4J_AUTH=neo4j/dev_metric123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dev_metric123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
